name: Build APK
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  build-apk:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android dizini kontrolü
        run: |
          if [ ! -d "android" ]; then
            echo "❌ android/ dizini yok! Önce 'pnpm exec cap add android' çalıştırın."
            exit 1
          fi

      - name: Gradle executable yap
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --build-cache --parallel --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parspel-apk
          path: android/app/build/outputs/apk/debug/*.apk