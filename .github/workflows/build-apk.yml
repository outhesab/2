name: Build APK
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Android SDK + local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ${{ github.workspace }}/android/local.properties
          echo "✅ local.properties yazıldı: $(cat ${{ github.workspace }}/android/local.properties)"

      - name: Build debug APK
        run: |
          ANDROID_DIR="${{ github.workspace }}/android"
          echo "📂 Dizin: $ANDROID_DIR"
          ls -la "$ANDROID_DIR/gradlew" 2>&1 || echo "⚠️ gradlew yok"
          ls -la "$ANDROID_DIR/gradle/wrapper/" 2>&1 || echo "⚠️ gradle/wrapper/ yok"
          chmod +x "$ANDROID_DIR/gradlew" "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" 2>/dev/null || true
          "$ANDROID_DIR/gradlew" -p "$ANDROID_DIR" assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parspel-apk
          path: android/app/build/outputs/apk/debug/*.apk