name: Build APK
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  build-apk:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: .
        run: pnpm run build

      - name: Sync Capacitor
        working-directory: .
        run: pnpm exec cap sync android

      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "✅ $(cat local.properties)"

      - name: Gradle wrapper oluştur (eksikse)
        run: |
          if [ ! -f "gradlew" ] || [ ! -x "gradlew" ]; then
            echo "⚠️ gradlew eksik veya çalıştırılamıyor — yeniden oluşturuluyor..."
            gradle wrapper --gradle-version 8.14.3
            chmod +x gradlew gradle/wrapper/gradle-wrapper.jar
            ls -la gradlew gradle/wrapper/gradle-wrapper.jar
          else
            echo "✅ gradlew mevcut ve çalıştırılabilir"
          fi

      - name: Build debug APK
        run: |
          echo "📦 APK derleniyor..."
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parspel-apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/debug/*.apk

      - name: Build Failed
        if: failure()
        run: |
          echo "❌ APK derlemesi başarısız. Hata günlüğü:"
          ls -la ${{ github.workspace }}/android/app/build/outputs/ 2>/dev/null || echo "Build output bulunamadı"
          exit 1