name: 📦 Dependency Lock Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [dev, main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  check-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify pnpm-lock.yaml is up-to-date
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "❌ HATA: pnpm-lock.yaml güncel değil!"
            echo ""
            echo "Yerel olarak çalıştır:"
            echo "  pnpm install"
            echo "  git add pnpm-lock.yaml"
            echo "  git commit -m 'chore: sync pnpm-lock.yaml'"
            echo "  git push"
            exit 1
          fi
          echo "✅ pnpm-lock.yaml güncel"