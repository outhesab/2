name: Block New Branch — main dışı koruma
on:
  create:
jobs:
  block:
    if: github.ref_name != 'dev' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Branch koruma — sadece main'den açılanları engelle
        run: |
          echo "❌ '${{ github.ref_name }}' branch'i doğrudan oluşturulamaz."
          echo "Lütfen 'dev' branch'inden yeni bir branch açın:"
          echo "   git checkout dev"
          echo "   git checkout -b feat/yeni-ozellik"
          gh api repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }} --method DELETE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
